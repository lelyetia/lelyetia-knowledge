site_name: lelyetia的个人知识库
site_url: https://lelyetia.github.io/lelyetia-knowledge/

theme:
  name: material
  language: zh
  features:
    - content.code.copy
    - content.footnote.tooltips
    - navigation.top
    - toc.follow

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.superfences
  - footnotes:
      SUPERSCRIPT_TEXT: '[{}]'
      BACKLINK_TITLE: '返回正文中的引用 {}'
  - toc:
      permalink: true
      permalink_title: 本节固定链接
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true

hooks:
  - hooks/note_versions.py

extra_css:
  - stylesheets/notebook.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 知识库介绍: main_page.md
  - 实用工具:
      - Git语法(未完成): practical-tools/git.md
      - Markdown语法: practical-tools/markdown.md
      - 软件:
          - "Clonezilla*": practical-tools/software/clonezilla.md
          - "GParted*": practical-tools/software/gparted.md
          - "Rufus*": practical-tools/software/rufus.md
  - 科研工具:
      - 总览: research-tools/index.md
      - Zotero: research-tools/zotero.md
      - Obsidian: research-tools/obsidian.md
  - 大模型技术:
      - skill教程: llm_application/skill_application.md
  - 学习资源:
      - 计算机科学基础:
          - (课程)CS50x: learning-resources/fundamentals-of-computer/CS50x.md
      - 机器学习:
          - (书籍)西瓜书与南瓜书: learning-resources/machine-learning/machine-learning-watermelon-pumpkin.md
      - 深度学习:
          - (书籍)深度学习入门（鱼书）: learning-resources/deep-learning/deep-learning-from-scratch.md
          - (书籍)动手学深度学习（书籍）: learning-resources/deep-learning/dive-into-deep-learning.md
          - (视频)动手学深度学习 v2（课程）: learning-resources/deep-learning/d2l-v2.md
          - (视频)PyTorch 入门课程（小土堆）: learning-resources/deep-learning/pytorch-xiaotudui.md
      - 计算机视觉:
          - (书籍)OpenCV 计算机视觉开发实践: learning-resources/computer-vision/opencv-python-practice.md
      - 更多学习资源: learning-resources/more-learning-resources.md
